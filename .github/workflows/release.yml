name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      # ── Windows: one-file .exe с иконкой и ресурсами внутри ──
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed \
            --name "FlipperAssetStudio" \
            --icon=assets/logo/fast_logo.ico \
            --add-data "assets;assets" main.py
          mv dist/FlipperAssetStudio.exe dist/FlipperAssetStudio_Windows_x86_64.exe

      # ── Linux: one-file ELF x86_64 ──
      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed \
            --name "FlipperAssetStudio" \
            --add-data "assets:assets" main.py
          mv dist/FlipperAssetStudio dist/FlipperAssetStudio_Linux_x86_64

      # ── macOS: .app (bundle) + raw onefile binary ──
      # Раннер macos-14 — Intel (x86_64): на Apple Silicon работает через Rosetta 2,
      # нативный arm64 собирается локально (./scripts/build.sh).
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          pyinstaller --clean --noconfirm --onefile --windowed \
            --name "FlipperAssetStudio" \
            --icon=assets/logo/fast_logo.icns \
            --add-data "assets:assets" main.py
          # PyInstaller снимает бит выполнения; без ad-hoc подписи на macOS
          # процесс убивается ("Launchd job spawn failed") — чиним как в build.sh.
          chmod +x dist/FlipperAssetStudio
          codesign --force --sign - dist/FlipperAssetStudio
          if [ -d dist/FlipperAssetStudio.app ]; then
            codesign --force --deep --sign - dist/FlipperAssetStudio.app
          fi
          mv dist/FlipperAssetStudio dist/FlipperAssetStudio_macOS_x86_64
          ditto -c -k --keepParent dist/FlipperAssetStudio.app dist/FlipperAssetStudio_macOS_x86_64.app.zip
          rm -rf dist/FlipperAssetStudio.app

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: dist/*

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-all/**/*
          generate_release_notes: true